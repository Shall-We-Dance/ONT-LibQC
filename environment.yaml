name: ont-library-qc
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python >=3.10,<3.14
  - snakemake >=9,<10
  - pyyaml
  - numpy
  - matplotlib
  - bowtie2 >=2.5
  - bwa-mem2 >=2.3
  - minimap2 >=2.28
  - samtools >=1.20
  - deeptools >=3.5
  - ucsc-bedgraphtobigwig
  - r-base >=4.3,<4.4
  - bioconductor-karyoploter >=1.28,<1.30
