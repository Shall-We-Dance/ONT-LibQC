    #       - {id: ecoli, label: E_coli, fasta: sources/ecoli.fa, role: spikein_candidate}
    #       - {id: fly, label: D_melanogaster, fasta: sources/dm6.fa, host_reference: dm6}
    #     decoys: [sources/bacterial_decoys.fa]
    #   mycoplasma:
    #     targets:
    #       - {id: mollicutes, label: Mollicutes, fasta: sources/mollicutes.fa}
    #     decoys: [sources/bacterial_decoys.fa]
  dm6:
    label: Fruit fly · dm6
    assembly: dm6
    fasta: sources/dm6.fa.gz
    annotation: sources/dm6.ncbiRefSeq.gtf.gz
    primary_chromosomes: [chr2L, chr2R, chr3L, chr3R, chr4, chrX]
