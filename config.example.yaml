metric_profile: ont_native
# The normal user-facing config needs only FASTQ(s), assay type and reference.
output_dir: .work
report_dir: report

default_reference: hg38
references:
  hg38:
    assembly: hg38  # displayed in every report
    primary_chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX]
    fasta: /path/to/hg38.fa
    chrom_sizes: /path/to/hg38.chrom.sizes
    annotation: /path/to/hg38.ncbiRefSeq.gtf
    bowtie2_index: /path/to/bowtie2/hg38/index_prefix
    bwa_mem2_index: /path/to/bwa-mem2/hg38/reference.fa
    # Optional host+Mollicutes competitive Bowtie2 index for this assembly:
    # mycoplasma_index: /path/to/hg38_mollicutes/index
  dm6:
    assembly: dm6
    primary_chromosomes: [chr2L, chr2R, chr3L, chr3R, chr4, chrX]
    fasta: /path/to/dm6.fa
    chrom_sizes: /path/to/dm6.chrom.sizes
    annotation: /path/to/dm6.ncbiRefSeq.gtf
    bowtie2_index: /path/to/bowtie2/dm6/index_prefix
    bwa_mem2_index: /path/to/bwa-mem2/dm6/reference.fa

# Optional overrides; these assay-appropriate defaults are shown explicitly.
# Optional opportunistic screen. A negative shallow screen never excludes contamination.
# If enabled, the index must contain host + Mollicutes + common bacterial/decoy contigs.
mycoplasma_screen:
  enabled: false
  target_contig_regex: "mycoplasma_target|mycoplasmopsis|mycoplasmoides|metamycoplasma|mesomycoplasma|acholeplasma|spiroplasma|ureaplasma|mollicutes"
  minimum_screened_reads: 500

# Optional spike-in quantification. The index must contain both host and spike-in
# contigs. Prefix spike-in contigs consistently and match them with the regex.
spike_in:
  enabled: false
  label: E_coli
  combined_bowtie2_index: /path/to/combined_host_spikein/index
  target_contig_regex: "^spikein_"
  minimum_screened_reads: 500
  minimum_aligned_bp: 80
  minimum_query_coverage: 0.80
  minimum_identity: 0.85

alignment:
  chromatin_mapper: bowtie2
  microc_mapper: bwa-mem2

# Mode: auto (all retained intervals 1 bp → reference_point, otherwise region); manual: reference_point or region.
# Optional samples.<sample>.custom_regions: {bed: target_regions.bed, assembly: dm6, label: Target domains, mode: auto}
# mode: auto selects reference_point for 1-bp intervals, otherwise region (scaled).
# The report retains the BED basename; optional bed_name overrides its display name.
samples:
  inputA:
    fastq:
      - /path/to/inputA.fastq.gz
    type: chromatin  # CUT&RUN, ChIP-seq, ATAC-seq or CUT&Tag
    reference: hg38  # omit to use default_reference
  sampleA:
    fastq:
      - /path/to/sampleA.fastq.gz
    type: chromatin
    reference: hg38
    # Optional expected physical pairs; otherwise they are discovered jointly.
    # index_pairs:
    #   - {name: libA, i5: ACGTACGT, i7: TGCATGCA}
    #   - {name: libB, i5: GATCTAGC, i7: CTAGATCG}
  sampleB:
    fastq:
      - /path/to/sampleB.fastq.gz
    type: microc     # Micro-C library; Hi-C requires the planned restriction-aware branch
    reference: dm6

params:
  # QC defaults are managed in workflow/scripts/metric_definitions.json.
  annotation_promoter_window_bp: 2000
  gene_profile_upstream_bp: 5000
  gene_profile_downstream_bp: 5000
  gene_profile_body_bp: 5000
  gene_profile_bin_size: 100
  gene_profile_sublibrary_threads: 16
  karyotype_bins_per_longest_chromosome: 250
  karyotype_gene_window_bp: 250000
  size_trace_max_bp: 2000
  size_trace_bandwidth: 0.045
  index_variant_max_edit: 2
  index_variant_dominance_ratio: 5.0
# mapq: 20, minimum_raw_reads: 500, minimum_complete_units: 200,
# microc_leg_length: 100, adapter_dimer_max_bp: 10, ultrashort_insert_max_bp: 50,
# adapter_dimer_raw_min_bp: 120, adapter_dimer_raw_max_bp: 170,
# adapter_dimer_template_identity: 0.80, single_index_pair_fraction: 0.90,
# minimum_index_informative_units: 20, minimum_index_cluster_units: 20,
# minimum_index_cluster_fraction: 0.01, index_variant_max_edit: 2,
# index_variant_dominance_ratio: 5.0
# also use built-in defaults unless placed under params above.

# These ranges are printed as text and also control traffic-light colors; no bars are drawn.
# Rate limits are fractions; set a metric to null to remove its cutoff.
qc_reference_ranges:
  raw_reads: {min: 500, warning_min: 250}
  mean_read_q: null  # All-base error-probability Q; calibrate for this ONT chemistry/basecaller.
  complete_read_rate: {min: 0.50, max: 1.00, warning_min: 0.30, type: percent}
  adapter_dimer_rate: {min: 0.00, max: 0.05, warning_max: 0.10, type: percent}
  primary_mapping_rate: {min: 0.50, max: 1.00, warning_min: 0.30, type: percent}
  usable_fragment_rate: {min: 0.30, max: 1.00, warning_min: 0.15, type: percent}
  mitochondrial_fraction: {min: 0.00, max: 0.20, warning_max: 0.40, type: percent}
  both_legs_mapping_rate: {min: 0.50, max: 1.00, warning_min: 0.30, type: percent}
  cis_ratio: null
  # Calibrate these against local controls before enabling:
  # valid_contact_rate: {min: 0.20, warning_min: 0.10, type: percent}
  # long_range_cis_fraction: {min: 0.10, warning_min: 0.05, type: percent}

